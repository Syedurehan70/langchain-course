[project]
name = "llm-factory"
version = "0.1.0"
description = "One place that decides which chat and embedding model each course project uses."
requires-python = ">=3.12"
dependencies = [
    "langchain~=1.3.18",
    "langchain-groq~=1.1",
    "langchain-ollama~=1.0",
]

[build-system]
requires = ["uv_build>=0.8,<0.12"]
build-backend = "uv_build"
