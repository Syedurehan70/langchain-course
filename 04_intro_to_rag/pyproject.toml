[project]
name = "intro-to-rag"
version = "0.1.0"
description = "RAG ingestion and retrieval: Ollama embeddings into a Pinecone index."
requires-python = ">=3.12"
dependencies = [
    "llm-factory",
    "langchain-community>=0.4.2",
    "langchain-text-splitters>=1.1.2",
    "langchain-ollama~=1.0",
    "langchain-pinecone>=0.2.13",
    "python-dotenv~=1.2",
]

[tool.uv]
package = false

[tool.uv.sources]
llm-factory = { workspace = true }
